<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassMana 跨裝置聯網對戰系統 (魔王至尊管理版)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #3498db;
            --warrior: #e74c3c;
            --mage: #9b59b6;
            --berserker: #d35400;
            --archer: #2ecc71;
            --boss: #2c3e50;
            --dark: #1a1a1a;
            --light: #f5f6fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang TC', sans-serif; }
        body { background-color: #121212; color: var(--light); padding: 15px; }
        
        header {
            text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 15px;
            background: linear-gradient(135deg, #2c3e50, #000); border: 1px solid #333;
        }
        h1 { font-size: 22px; color: #fff; }
        .room-badge { background: #e67e22; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; }

        /* 聯網登入面板 */
        .login-panel { background: #1e1e1e; border: 2px solid #444; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #ccc; }
        .form-control { width: 100%; padding: 10px; background: #333; border: 1px solid #555; color: #fff; border-radius: 8px; }
        
        /* 戰場佈局 */
        .battlefield { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 992px) { .battlefield { grid-template-columns: 2fr 1fr; } }

        /* 角色列表與卡片 */
        .players-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 15px; border: 2px solid #333; position: relative; }
        .card.is-me { border-color: var(--primary); box-shadow: 0 0 12px rgba(52, 152, 219, 0.5); }
        .card.is-me::after { content: "🎯 我的角色"; position: absolute; top: -10px; right: 10px; background: var(--primary); font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .role-tag { padding: 2px 6px; border-radius: 20px; font-size: 11px; font-weight: bold; color: #fff; }
        .level-badge { background: #f1c40f; color: #000; font-weight: bold; padding: 2px 5px; border-radius: 4px; font-size: 11px; }
        
        .bg-warrior { background-color: var(--warrior); }
        .bg-mage { background-color: var(--mage); }
        .bg-berserker { background-color: var(--berserker); }
        .bg-archer { background-color: var(--archer); }
        .bg-boss { background-color: var(--boss); border: 1px solid #f1c40f; }

        /* 屬性條 */
        .bar-container { margin: 6px 0; font-size: 11px; }
        .bar-label { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .bar { height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
        .fill { height: 100%; transition: width 0.3s ease; }
        .fill-hp { background: linear-gradient(90deg, #ff4d4d, #ff0000); }
        .fill-en { background: linear-gradient(90deg, #f1c40f, #f39c12); }
        .fill-exp { background: linear-gradient(90deg, #2ecc71, #27ae60); }
        .ap-badge { background: #2980b9; color: white; padding: 1px 5px; border-radius: 4px; font-weight: bold; }

        /* 控制面板 */
        .control-panel { background: #252525; border-radius: 12px; padding: 15px; border: 1px solid #444; }
        .section-title { font-size: 15px; margin-bottom: 10px; color: #fff; border-left: 4px solid var(--primary); padding-left: 8px; }
        .skill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        
        .btn { 
            background: #333; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 8px; 
            cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.1s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { 
            background: #151515; color: #444; border-color: #222; cursor: not-allowed; filter: grayscale(1) opacity(0.35); 
        }
        .btn-ult { background: linear-gradient(135deg, #8e44ad, #c0392b); border: 1px solid #f1c40f; }
        .target-select { width: 100%; padding: 8px; background: #333; color: white; border-radius: 8px; margin-bottom: 15px; }

        /* 日誌 */
        .log-box { background: #000; border-radius: 8px; padding: 10px; height: 130px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #00ff00; border: 1px solid #333; }
        .log-entry { margin-bottom: 3px; }
        .log-alert-red { color: #ff3333 !important; font-weight: bold; }
        
        /* 👑 老師至尊管理後台與戶口資料庫樣式 */
        .boss-panel { background: #2c3e50; border: 2px solid #f1c40f; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: none; }
        .boss-monitor-box { background: #141d26; border: 1px solid #f1c40f; border-radius: 8px; padding: 12px; margin-top: 15px; }
        .monitor-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; margin-top: 10px; }
        .monitor-table th, .monitor-table td { padding: 8px; border-bottom: 1px solid #333; }
        .monitor-table th { background: #1e2b37; color: #f1c40f; }
        .input-sm { width: 50px; padding: 3px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>ClassMana 跨裝置多人在線對戰系統 <span id="room-display" class="room-badge">未連線房間</span></h1>
    </header>

    <div class="login-panel" id="login-panel">
        <h2 class="section-title" style="border-left-color: #e67e22;">🌐 步驟一：iPad 雲端安全驗證登入</h2>
        <div class="grid-4">
            <div class="form-group">
                <label>🏠 房間號碼 (全班需一致)：</label>
                <input type="text" id="room-id" class="form-control" value="101">
            </div>
            <div class="form-group">
                <label>👤 登入學號 / ID：</label>
                <input type="text" id="player-id" class="form-control" placeholder="例如：1A01 或 Teacher">
            </div>
            <div class="form-group">
                <label>🔑 登入密碼 / PWD：</label>
                <input type="password" id="player-pwd" class="form-control" placeholder="請輸入對應密碼">
            </div>
            <div class="form-group">
                <label>⚔️ 選擇職業 (新角色首登生效)：</label>
                <select id="player-job" class="form-control">
                    <option value="戰士">戰士 (高血高防護盾)</option>
                    <option value="法師">法師 (高魔傷大範圍)</option>
                    <option value="狂戰士">狂戰士 (血少狂暴吸血)</option>
                    <option value="弓手">弓手 (下毒扣AP控制)</option>
                </select>
            </div>
        </div>
        <button class="btn" onclick="connectToRoom()" style="background: #27ae60; border-color: #2ecc71; padding: 10px 25px; font-size: 14px;">📡 線上安全驗證並登入</button>
    </div>

    <div class="boss-panel" id="boss-panel">
        <h3 style="color:#f1c40f; margin-bottom:5px;">😈 尊貴的魔王老師管理後台 (ID: Teacher)</h3>
        <p style="font-size: 12px; color: #ddd; margin-bottom: 10px;">預設等級：<b>9999</b>，初始血量：<b>99999</b>。AP 有限，請掌握課堂節奏。</p>
        
        <div style="display: flex; gap: 10px;">
            <button class="btn" onclick="bossDistributeAP()" style="background: #e67e22; border-color: #d35400;">📢 發放全體生存同學 +2 AP</button>
            <button class="btn" onclick="bossResetRoom()" style="background: #c0392b; border-color: #95a5a6;">🔄 重置此房間所有數據</button>
        </div>

        <div class="boss-monitor-box">
            <h4 style="color:#2ecc71; display:flex; justify-content:space-between; align-items:center;">
                <span>📊 全體角色線上資料庫即時監控面板 (跟隨 ID)</span>
                <button class="btn" onclick="loadGlobalUsersMonitor()" style="padding:4px 8px; font-size:11px; background:#2980b9;">🔄 重新整理資料庫</button>
            </h4>
            <div style="max-height: 250px; overflow-y: auto; margin-top: 8px;">
                <table class="monitor-table">
                    <thead>
                        <tr>
                            <th>學生學號 (ID)</th>
                            <th>雲端預設密碼</th>
                            <th>當前線上職業</th>
                            <th>當前等級 (Lv)</th>
                            <th>累積經驗 (EXP)</th>
                            <th>管理操作</th>
                        </tr>
                    </thead>
                    <tbody id="monitor-tbody">
                        <tr><td colspan="6" style="color:#888; text-align:center;">正在讀取線上全體戶口資料...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="battlefield">
        <div>
            <h2 class="section-title">👥 本房間所有在線玩家 (即時雲端聯網)</h2>
            <div id="players-container" class="players-list">
                <p style="color:#888; font-style:italic;">等待登入驗證中...</p>
            </div>
        </div>

        <div>
            <div class="control-panel">
                <h2 class="section-title">🎮 我的 iPad 行動面板</h2>
                <p style="font-size: 12px; margin-bottom: 10px; color: #aaa;">
                    當前身分：<span id="my-status-display" style="color:var(--primary); font-weight:bold;">未連線</span>
                </p>
                
                <label for="target-dropdown" style="font-size:11px; color:#ccc; display:block; margin-bottom:3px;">🎯 選擇施放目標 (絕對不可選擇自己)：</label>
                <select id="target-dropdown" class="target-select"><option value="">-- 請先連線 --</option></select>

                <label style="font-size:11px; color:#ccc; display:block; margin-bottom:3px;">✨ 技能面板 (AP 不足時會自動變暗)：</label>
                <div id="skills-container" class="skill-grid"></div>

                <h2 class="section-title" style="margin-top:10px;">📜 房間即時戰況日誌</h2>
                <div id="log-box" class="log-box"></div>
            </div>
        </div>
    </div>

    <script>

        // 按比例計算 1-100 等級增幅 (每級增加 10% 基礎屬性)，若為魔王則直接固定至尊數據
        function getScaledStats(job, level) {
            if (job === '魔王(老師)') {
                return { hp: 99999, en: 9999, def: 500, patk: 200, matk: 200 };
            }
            const base = CLASS_CONFIGS[job];
            const multiplier = 1 + (level - 1) * 0.1; 
            return {
                hp: Math.floor(base.hp * multiplier),
                en: Math.floor(base.en * multiplier),
                def: Math.floor(base.def * multiplier),
                patk: Math.floor(base.patk * multiplier),
                matk: Math.floor(base.matk * multiplier)
            };
        }

            ],

                { name: '點名突擊', apCost: 1, enCost: 0, type: 'atk_p', value: 60 },
                { name: '隨堂小測驗', apCost: 2, enCost: 0, type: 'atk_m', value: 40 },
                { name: '沒收 iPad',  apCost: 3, enCost: 0, type: 'debuff_ap', value: 2 },

                { name: '期末考降臨', apCost: 4, enCost: 120, type: 'atk_m', value: 150 }
            ]
        };

        // ⚠️【請注意】：第一次部署到網上成功並登入後，即可將此 INITIAL_AC_DATA 大清單整段【安全刪除】！

            "6A14": "z0otm0zk", "6A15": "p1lbpd2h", "6A16": "txrwtqcg", "6A17": "n6hz18n8", "6A18": "2fcf78qx", "6A19": "tzgi0jmv",

            "6A26": "fv3kd0c4", "6A27": "w315s77m", "6A28": "esmc1523", "6A29": "kr5tzr8s", "6A30": "0qk6yadc"
        };

        let currentRoom = null;
        let myId = null; 
        let allPlayersData = {};

        // === 🚀 雲端自動初始化與線上安全驗證登入 ===
        function connectToRoom() {
            const roomNum = document.getElementById('room-id').value.trim();
            const inputId = document.getElementById('player-id').value.trim();
            const inputPwd = document.getElementById('player-pwd').value;
            const chosenJob = document.getElementById('player-job').value;

            if (!roomNum || !inputId || !inputPwd) { return alert('請完整填寫房間、ID與密碼！'); }

            // 第一次執行時，若發現雲端密碼庫完全空置，則自動進行一鍵線上備份建立
            database.ref('secret_auth').once('value', (snapshot) => {
                if (!snapshot.exists() && typeof INITIAL_AC_DATA !== 'undefined') {
                    database.ref('secret_auth').set(INITIAL_AC_DATA);
                    alert('💡 偵測到首次部署！已成功將 AC Excel 的對照密碼庫安全搬移至雲端儲存。');
                }

                // 🔍 開始比對線上真實安全庫
                database.ref(`secret_auth/${inputId}`).once('value', (authSnap) => {
                    if (!authSnap.exists() || authSnap.val() !== inputPwd) {
                        return alert('❌ 登入失敗：ID 不存在或驗證密碼錯誤！');
                    }

                    currentRoom = roomNum;
                    const isBoss = (inputId === 'Teacher');
                    myId = isBoss ? 'teacher_boss' : 'student_' + inputId;
                    const finalJob = isBoss ? '魔王(老師)' : chosenJob;

                    // 🛑 限制防偷跑機制
                    if (!isBoss) {
                        database.ref(`rooms/${currentRoom}/players/teacher_boss`).once('value', (snap) => {
                            if (!snap.exists() || snap.val().hp <= 0) {
                                alert('❌ 該房間目前沒有魔王(老師)在線！無法登入，請等待老師開啟房間。');
                            } else {
                                proceedLogin(inputId, finalJob);
                            }
                        });
                    } else {
                        database.ref(`rooms/${currentRoom}/players/teacher_boss`).once('value', (snap) => {
                            if (snap.exists() && snap.val().hp > 0) {
                                alert('❌ 房間內已有一個正在戰鬥的魔王老師了！');
                            } else {
                                proceedLogin(inputId, finalJob);
                            }
                        });
                    }
                });
            });
        }

        // 讀取角色雲端歷史進度 (等級與 EXP 永久儲存在線上)
        function proceedLogin(inputId, job) {
            database.ref(`global_users/${inputId}`).once('value', (snapshot) => {
                let userData = snapshot.val();
                
                // 初次登入的全新玩家，自動在線上初始化
                if (!userData) {
                    userData = {
                        level: (inputId === 'Teacher') ? 9999 : 1, // 魔王預設 9999 級
                        exp: 0,
                        job: job
                    };
                    database.ref(`global_users/${inputId}`).set(userData);
                }

                // 如果是魔王，確保等級是 9999
                if (inputId === 'Teacher') {
                    userData.level = 9999;
                }

                const scaledStats = getScaledStats(userData.job, userData.level);
                const sessionData = {
                    id: myId,
                    userId: inputId,
                    name: inputId,
                    job: userData.job,
                    level: userData.level,
                    exp: userData.exp,
                    hp: scaledStats.hp, // 魔王將會是 99999
                    en: 0,
                    ap: (userData.job === '魔王(老師)') ? 20 : 3 
                };

                startFirebaseSync(sessionData);
            });
        }

        function startFirebaseSync(sessionData) {
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('room-display').innerText = `房間：${currentRoom}`;
            
            if(sessionData.job === '魔王(老師)') {
                document.getElementById('boss-panel').style.display = 'block';
                loadGlobalUsersMonitor(); // 魔王自動載入戶口監控
            }

            const myRef = database.ref(`rooms/${currentRoom}/players/${myId}`);
            myRef.set(sessionData);
            myRef.onDisconnect().remove();

            database.ref(`rooms/${currentRoom}/players`).on('value', (snapshot) => {
                allPlayersData = snapshot.val() || {};
                
                // 魔王離線解散房間
                if (myId !== 'teacher_boss' && !allPlayersData.hasOwnProperty('teacher_boss')) {
                    database.ref(`rooms/${currentRoom}/players`).off();
                    database.ref(`rooms/${currentRoom}/logs`).off();
                    alert('⚠️ 魔王老師已離開或房間關閉，所有人已被安全登出。');
                    location.reload();
                    return;
                }

                renderAllPlayers();
                updateControlPanel();
                populateTargets();
            });

            database.ref(`rooms/${currentRoom}/logs`).limitToLast(12).on('value', (snapshot) => {
                const logs = snapshot.val() || {};
                const logBox = document.getElementById('log-box');
                logBox.innerHTML = '';
                Object.values(logs).forEach(l => {
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    if (l.includes('[🔴警告]') || l.includes('🌟') || l.includes('👑')) {
                        entry.className += ' log-alert-red';
                    }
                    entry.innerText = l;
                    logBox.appendChild(entry);
                });
                logBox.scrollTop = logBox.scrollHeight;
            });

            sendGlobalLog(`🚀【${sessionData.name}】(Lv.${sessionData.level} ${sessionData.job}) 已登入聯網戰場！`);
        }

        // === 📊 👑 老師專屬：全體戶口資料庫讀取與等級更改系統 ===
        function loadGlobalUsersMonitor() {
            const tbody = document.getElementById('monitor-tbody');
            tbody.innerHTML = `<tr><td colspan="6" style="color:#888; text-align:center;">正在向伺服器同步全體角色資料...</td></tr>`;

            // 同時抓取密碼庫與等級歷史進度庫
            database.ref('secret_auth').once('value', (authSnapshot) => {
                const auths = authSnapshot.val() || {};
                
                database.ref('global_users').once('value', (userSnapshot) => {
                    const users = userSnapshot.val() || {};
                    tbody.innerHTML = '';

                    // 依據原始帳密清單進行遍歷排列
                    Object.keys(auths).forEach(userId => {
                        const pwd = auths[userId];
                        const progress = users[userId] || { level: 1, exp: 0, job: '未登入過' };
                        
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="color:#3498db; font-weight:bold;">${userId}</td>
                            <td style="font-family:monospace; color:#aaa;">${pwd}</td>
                            <td><span class="role-tag" style="background:#444;">${progress.job}</span></td>
                            <td>
                                <input type="number" id="input-lv-${userId}" class="input-sm" value="${progress.level}">
                            </td>
                            <td>${progress.exp}</td>
                            <td>
                                <button class="btn" onclick="bossModifyUserLevel('${userId}')" style="display:inline-block; padding:2px 6px; font-size:11px; background:#2ecc71; border:none; margin-right:4px;">儲存等級</button>
                                <button class="btn" onclick="bossResetUserLevel('${userId}')" style="display:inline-block; padding:2px 6px; font-size:11px; background:#95a5a6; border:none;">重置1等</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
            });
        }

        // 魔王手動更改任何角色的等級
        function bossModifyUserLevel(targetUserId) {
            const newLv = parseInt(document.getElementById(`input-lv-${targetUserId}`).value);
            if (isNaN(newLv) || newLv < 1 || newLv > 10000) {
                return alert('請輸入合理的等級數值 (1 - 10000)！');
            }

            // 1. 更新線上的永久歷史進度庫
            database.ref(`global_users/${targetUserId}`).update({
                level: newLv,
                exp: 0
            }).then(() => {
                // 2. 如果該角色此刻正在房間內戰鬥，同時更新他房間內的動態即時數值
                const sid = (targetUserId === 'Teacher') ? 'teacher_boss' : 'student_' + targetUserId;
                if (allPlayersData[sid]) {
                    const currentPlayerData = allPlayersData[sid];
                    const scaled = getScaledStats(currentPlayerData.job, newLv);
                    
                    currentPlayerData.level = newLv;
                    currentPlayerData.exp = 0;
                    currentPlayerData.hp = scaled.hp; // 變更等級時血量同步更正
                    database.ref(`rooms/${currentRoom}/players/${sid}`).set(currentPlayerData);
                }
                
                sendGlobalLog(`👑 魔王老師動用特權：將【${targetUserId}】的線上預設等級修改為 Lv.${newLv}！`);
                alert(`成功將 ${targetUserId} 等級修改為 ${newLv} 級！`);
                loadGlobalUsersMonitor();
            });
        }

        // 魔王一鍵重置任何角色回 1 等
        function bossResetUserLevel(targetUserId) {
            if (confirm(`確定要完全重置【${targetUserId}】的線上等級回 1 等嗎？`)) {
                document.getElementById(`input-lv-${targetUserId}`).value = 1;
                bossModifyUserLevel(targetUserId);
            }
        }

        // === 👥 渲染戰場玩家卡片 ===
        function renderAllPlayers() {
            const container = document.getElementById('players-container');
            container.innerHTML = '';

            Object.values(allPlayersData).forEach(player => {
                const scaled = getScaledStats(player.job, player.level);
                const isDead = player.hp <= 0;
                const hpPercent = Math.max(0, (player.hp / scaled.hp) * 100);
                const enPercent = Math.max(0, (player.en / scaled.en) * 100);
                const reqExp = player.level * 100;
                const expPercent = Math.min(100, (player.exp / reqExp) * 100);

                const card = document.createElement('div');
                card.className = `card ${player.id === myId ? 'is-me' : ''}`;
                if (isDead) card.style.opacity = '0.4';

                card.innerHTML = `
                    <div class="card-header">
                        <strong style="font-size:14px;">${player.name} ${isDead ? '💀' : ''}</strong>
                        <span class="level-badge">Lv.${player.level}</span>
                        <span class="role-tag ${CLASS_CONFIGS[player.job].colorClass}">${player.job}</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-label"><span>HP (${player.hp}/${scaled.hp})</span></div>
                        <div class="bar"><div class="fill fill-hp" style="width: ${hpPercent}%"></div></div>
                    </div>
                    <div class="bar-container">
                        <div class="bar-label"><span>EN (${player.en}/${scaled.en})</span></div>
                        <div class="bar"><div class="fill fill-en" style="width: ${enPercent}%"></div></div>
                    </div>
                    <div class="bar-container">
                        <div class="bar-label" style="color:#2ecc71;"><span>EXP (${player.exp}/${reqExp})</span></div>
                        <div class="bar" style="height:6px;"><div class="fill fill-exp" style="width: ${expPercent}%"></div></div>
                    </div>
                    <div style="margin-top:5px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#aaa;">
                        <span>防:${scaled.def} 攻:${scaled.patk}</span>
                        <span class="ap-badge">AP: ${player.ap}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateControlPanel() {
            const me = allPlayersData[myId];
            if (!me) return;

            document.getElementById('my-status-display').innerText = `${me.name} (Lv.${me.level} ${me.job})`;
            const skillsContainer = document.getElementById('skills-container');
            skillsContainer.innerHTML = '';

            const totalSkills = [...SKILL_DATABASE['通用'], ...SKILL_DATABASE[me.job]];
            
            totalSkills.forEach(skill => {
                const btn = document.createElement('button');
                btn.className = `btn ${skill.enCost > 0 ? 'btn-ult' : ''}`;
                
                const hasEnoughAP = me.ap >= skill.apCost;
                const hasEnoughEN = me.en >= skill.enCost;
                
                if (me.ap <= 0 || !hasEnoughAP || !hasEnoughEN || me.hp <= 0) {
                    btn.disabled = true;
                }
                btn.innerHTML = `<span>${skill.name}</span><span style="font-size:9px;color:#aaa;">AP:${skill.apCost}</span>`;

                btn.onclick = () => {
                    const currentMe = allPlayersData[myId];
                    if (!currentMe || currentMe.hp <= 0) return;
                    executeBattleAction(currentMe, skill);
                };
                skillsContainer.appendChild(btn);
            });
        }

        function populateTargets() {
            const dropdown = document.getElementById('target-dropdown');
            const currentSel = dropdown.value;
            dropdown.innerHTML = '';

            Object.values(allPlayersData).forEach(p => {
                if (p.hp > 0) {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.innerText = `${p.id === myId ? '【自己】' : ''}${p.name} (Lv.${p.level}) - HP:${p.hp}`;
                    dropdown.appendChild(opt);
                }
            });
            if (currentSel) dropdown.value = currentSel;
        }

        // === ⚔️ 核心戰鬥與升級經驗結算演算 ===
        function executeBattleAction(me, skill) {
            const targetId = document.getElementById('target-dropdown').value;
            const target = allPlayersData[targetId];

            if (!target && skill.type !== 'charge') return alert('請選擇一個目標！');

            // 不准打自己
            const attackTypes = ['atk_p', 'atk_m', 'ult_berserk', 'debuff_ap'];
            if (target && target.id === me.id && attackTypes.includes(skill.type)) {
                return alert('🚫 錯誤：不可以選擇自己作為攻擊或扣除 AP 的目標！');
            }

            if (me.ap < skill.apCost) return;
            me.ap -= skill.apCost;
            me.en -= skill.enCost;

            let logText = '';
            let isDmgDealt = false;
            const myScaled = getScaledStats(me.job, me.level);
            const targetScaled = target ? getScaledStats(target.job, target.level) : null;

            if (skill.type === 'charge') {
                me.en = Math.min(myScaled.en, me.en + skill.value);
                logText = `⚡【${me.name}】使用 [${skill.name}]，將 EN 提升了 ${skill.value} 點。`;
            } else {
                if (skill.type === 'atk_p') {
                    let dmg = Math.max(1, (myScaled.patk + skill.value) - targetScaled.def);
                    target.hp = Math.max(0, target.hp - dmg);
                    target.en = Math.min(targetScaled.en, target.en + 10);
                    logText = `⚔️【${me.name}】對【${target.name}】施展 [${skill.name}]，造成 ${dmg} 點物理傷害！`;
                    isDmgDealt = true;
                } else if (skill.type === 'atk_m') {
                    let dmg = Math.max(1, (myScaled.matk + skill.value) - Math.floor(targetScaled.def * 0.5));
                    target.hp = Math.max(0, target.hp - dmg);
                    target.en = Math.min(targetScaled.en, target.en + 15);
                    logText = `🔮【${me.name}】對【${target.name}】施展 [${skill.name}]，轟出 ${dmg} 點法術傷害！`;
                    isDmgDealt = true;
                } else if (skill.type === 'heal') {
                    target.hp = Math.min(targetScaled.hp, target.hp + skill.value);
                    logText = `💚【${me.name}】使用 [${skill.name}]，幫【${target.name}】回復 ${skill.value} 點 HP！`;
                } else if (skill.type === 'debuff_ap') {
                    target.ap = Math.max(0, target.ap - skill.value);
                    logText = `🚫【${me.name}】對【${target.name}】使出 [${skill.name}]，扣除其 ${skill.value} 點 AP！`;
                } else if (skill.type === 'boss_heal') {
                    me.hp = Math.min(myScaled.hp, me.hp + skill.value);
                    target.ap += 2;
                    logText = `👑 魔王老師使用 [${skill.name}]！自補 ${skill.value}，並賞賜目標同學 2 AP！`;
                } else if (skill.type === 'ult_berserk') {
                    let dmg = Math.max(1, (myScaled.patk + skill.value) - targetScaled.def);
                    target.hp = Math.max(0, target.hp - dmg);
                    me.hp = Math.min(myScaled.hp, me.hp + Math.floor(dmg * 0.5));
                    logText = `🔥【${me.name}】開啟 [諸神黃昏] 劈向【${target.name}】造成 ${dmg} 傷害並狂暴吸血！`;
                    isDmgDealt = true;
                } else if (skill.type === 'log_only') {
                    logText = `✨【${me.name}】對【${target.name}】施展了 [${skill.name}]！`;
                }

                // 📈 經驗值結算（最高 100 級，魔王 9999 級不觸發此邏輯）
                if (isDmgDealt && me.level < 100 && me.job !== '魔王(老師)') {
                    const reqExp = me.level * 100;
                    
                    if (target.hp <= 0) {
                        const killExp = Math.floor(reqExp / 3);
                        me.exp += killExp;
                        logText += ` 💀【${target.name}】已陣亡！【${me.name}】獲得 1/3 擊殺經驗 ${killExp} 點！`;
                    } else {
                        const pct = Math.floor(Math.random() * 5) + 1; // 1% ~ 5%
                        const atkExp = Math.floor(reqExp * (pct / 100));
                        me.exp += atkExp;
                        logText += ` (獲得傷害經驗值 ${atkExp} 點)`;
                    }

                    if (me.exp >= reqExp) {
                        me.exp -= reqExp;
                        me.level = Math.min(100, me.level + 1);
                        logText += ` 🌟🌟 恭喜升級！【${me.name}】提升至 Lv.${me.level}！`;
                        const newScaled = getScaledStats(me.job, me.level);
                        me.hp = newScaled.hp; 
                        
                        database.ref(`global_users/${me.userId}`).update({
                            level: me.level,
                            exp: me.exp
                        });
                    }
                }
            }

            database.ref(`rooms/${currentRoom}/players/${me.id}`).set(me);
            if (target && target.id !== me.id) {
                database.ref(`rooms/${currentRoom}/players/${target.id}`).set(target);
            }
            sendGlobalLog(logText);
        }

        function sendGlobalLog(text) {
            database.ref(`rooms/${currentRoom}/logs`).push(`[${new Date().toLocaleTimeString()}] ${text}`);
        }

        function bossDistributeAP() {
            Object.values(allPlayersData).forEach(p => {
                if (p.hp > 0 && p.job !== '魔王(老師)') {
                    database.ref(`rooms/${currentRoom}/players/${p.id}/ap`).set(p.ap + 2);
                }
            });
            sendGlobalLog(`📢 老師按下控制台：「發放全體同學 +2 AP！」`);
        }

        function bossResetRoom() {
            if(confirm("確定要重置整個房間嗎？(不影響各人線上歷史等級)")) {
                Object.values(allPlayersData).forEach(p => {
                    const scaled = getScaledStats(p.job, p.level);
                    p.hp = scaled.hp;
                    p.en = 0;
                    p.ap = (p.job === '魔王(老師)') ? 20 : 3;
                    database.ref(`rooms/${currentRoom}/players/${p.id}`).set(p);
                });
                database.ref(`rooms/${currentRoom}/logs`).remove();
                sendGlobalLog(`🔄 戰場已被魔王老師重置，新一輪課堂對決點燃！`);
            }
        }
    </script>
</body>
</html>
