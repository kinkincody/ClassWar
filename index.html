<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassMana 跨裝置聯網對戰系統 (無魔王禁登版)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #3498db;
            --warrior: #e74c3c;
            --mage: #9b59b6;
            --berserker: #d35400;
            --archer: #2ecc71;
            --boss: #2c3e50;
            --dark: #1a1a1a;
            --light: #f5f6fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang TC', sans-serif; }
        body { background-color: #121212; color: var(--light); padding: 15px; }
        
        header {
            text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 15px;
            background: linear-gradient(135deg, #2c3e50, #000); border: 1px solid #333;
        }
        h1 { font-size: 22px; color: #fff; }
        .room-badge { background: #e67e22; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; }

        /* 聯網登入面板 */
        .login-panel { background: #1e1e1e; border: 2px solid #444; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #ccc; }
        .form-control { width: 100%; padding: 10px; background: #333; border: 1px solid #555; color: #fff; border-radius: 8px; }
        
        /* 戰場佈局 */
        .battlefield { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 992px) { .battlefield { grid-template-columns: 2fr 1fr; } }

        /* 角色列表與卡片 */
        .players-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 15px; border: 2px solid #333; position: relative; }
        .card.is-me { border-color: var(--primary); box-shadow: 0 0 12px rgba(52, 152, 219, 0.5); }
        .card.is-me::after { content: "🎯 我的角色"; position: absolute; top: -10px; right: 10px; background: var(--primary); font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .role-tag { padding: 2px 6px; border-radius: 20px; font-size: 11px; font-weight: bold; color: #fff; }
        
        .bg-warrior { background-color: var(--warrior); }
        .bg-mage { background-color: var(--mage); }
        .bg-berserker { background-color: var(--berserker); }
        .bg-archer { background-color: var(--archer); }
        .bg-boss { background-color: var(--boss); border: 1px solid #f1c40f; }

        /* 屬性條 */
        .bar-container { margin: 6px 0; font-size: 11px; }
        .bar-label { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .bar { height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
        .fill { height: 100%; transition: width 0.3s ease; }
        .fill-hp { background: linear-gradient(90deg, #ff4d4d, #ff0000); }
        .fill-en { background: linear-gradient(90deg, #f1c40f, #f39c12); }
        .ap-badge { background: #2980b9; color: white; padding: 1px 5px; border-radius: 4px; font-weight: bold; }

        /* 控制面板 */
        .control-panel { background: #252525; border-radius: 12px; padding: 15px; border: 1px solid #444; }
        .section-title { font-size: 15px; margin-bottom: 10px; color: #fff; border-left: 4px solid var(--primary); padding-left: 8px; }
        .skill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        
        .btn { 
            background: #333; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 8px; 
            cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.1s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn:active { transform: scale(0.98); }
        
        /* 當技能變暗/不可按時的特殊灰階樣式 */
        .btn:disabled { 
            background: #151515; 
            color: #444; 
            border-color: #222; 
            cursor: not-allowed; 
            filter: grayscale(1) opacity(0.35); 
        }
        .btn-ult { background: linear-gradient(135deg, #8e44ad, #c0392b); border: 1px solid #f1c40f; }
        .target-select { width: 100%; padding: 8px; background: #333; color: white; border-radius: 8px; margin-bottom: 15px; }

        /* 日誌與特殊紅色樣式 */
        .log-box { background: #000; border-radius: 8px; padding: 10px; height: 130px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #00ff00; border: 1px solid #333; }
        .log-entry { margin-bottom: 3px; }
        .log-alert-red { color: #ff3333 !important; font-weight: bold; }
        
        /* 老師特殊面板 */
        .boss-panel { background: #2c3e50; border: 2px solid #f1c40f; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>ClassMana 跨裝置多人在線對戰系統 <span id="room-display" class="room-badge">未連線房間</span></h1>
    </header>

    <div class="login-panel" id="login-panel">
        <h2 class="section-title" style="border-left-color: #e67e22;">🌐 步驟一：iPad 連線登入與房間配對</h2>
        <div class="grid-3">
            <div class="form-group">
                <label>🏠 房間號碼 (全班需輸入相同)：</label>
                <input type="text" id="room-id" class="form-control" value="101">
            </div>
            <div class="form-group">
                <label>👤 你的名字：</label>
                <input type="text" id="player-name" class="form-control" placeholder="例如：林大明">
            </div>
            <div class="form-group">
                <label>⚔️ 選擇職業：</label>
                <select id="player-job" class="form-control" onchange="togglePasswordInput()">
                    <option value="戰士">戰士 (高血高防護盾)</option>
                    <option value="法師">法師 (高魔傷大範圍)</option>
                    <option value="狂戰士">狂戰士 (血少狂暴吸血)</option>
                    <option value="弓手">弓手 (下毒扣AP控制)</option>
                    <option value="魔王(老師)">👑 魔王(老師) - 需密碼</option>
                </select>
            </div>
            <div class="form-group" id="pwd-group" style="display: none;">
                <label style="color: #f1c40f;">🔑 魔王認證密碼：</label>
                <input type="password" id="boss-password" class="form-control" placeholder="請輸入魔王密碼">
            </div>
        </div>
        <button class="btn" onclick="connectToRoom()" style="background: #27ae60; border-color: #2ecc71; padding: 10px 25px; font-size: 14px;">📡 進入房間並同步連線</button>
    </div>

    <div class="boss-panel" id="boss-panel">
        <h3 style="color:#f1c40f; margin-bottom:5px;">😈 尊貴的魔王老師管理後台</h3>
        <p style="font-size: 12px; color: #ddd; margin-bottom: 10px;">您已成功掌控此房間。您可以即時監控下方所有加入的學生，並掌控全局點數發放。</p>
        <div style="display: flex; gap: 10px;">
            <button class="btn" onclick="bossDistributeAP()" style="background: #e67e22; border-color: #d35400;">📢 發放全體生存同學 +2 AP</button>
            <button class="btn" onclick="bossResetRoom()" style="background: #c0392b; border-color: #95a5a6;">🔄 重置此房間所有數據</button>
        </div>
    </div>

    <div class="battlefield">
        
        <div>
            <h2 class="section-title">👥 本房間所有在線玩家 (即時聯網渲染中)</h2>
            <div id="players-container" class="players-list">
                <p style="color:#888; font-style:italic;">等待連線中...</p>
            </div>
        </div>

        <div>
            <div class="control-panel">
                <h2 class="section-title">🎮 我的 iPad 行動面板</h2>
                <p style="font-size: 12px; margin-bottom: 10px; color: #aaa;">
                    當前身分：<span id="my-status-display" style="color:var(--primary); font-weight:bold;">未連線</span>
                </p>
                
                <label for="target-dropdown" style="font-size:11px; color:#ccc; display:block; margin-bottom:3px;">🎯 選擇施放目標 (可選自己、老師或同學)：</label>
                <select id="target-dropdown" class="target-select"><option value="">-- 請先連線 --</option></select>

                <label style="font-size:11px; color:#ccc; display:block; margin-bottom:3px;">✨ 技能面板 (AP 0 時會自動變暗)：</label>
                <div id="skills-container" class="skill-grid"></div>

                <h2 class="section-title" style="margin-top:10px;">📜 房間即時戰況日誌</h2>
                <div id="log-box" class="log-box"></div>
            </div>
        </div>
    </div>

    <script>
        // === 🛠️ FREE FIREBASE 免費雲端資料庫設定 ===
        const firebaseConfig = {
            databaseURL: "https://classwar-91a0a-default-rtdb.asia-southeast1.firebasedatabase.app/" 
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // === 🎲 遊戲數值配置 (魔王血量全面大幅提升至 99999) ===
        const CLASS_CONFIGS = {
            '戰士':    { hp: 150, en: 100, def: 25, patk: 15, matk: 5,  colorClass: 'bg-warrior' },
            '法師':    { hp: 80,  en: 150, def: 5,  patk: 5,  matk: 30, colorClass: 'bg-mage' },
            '狂戰士':  { hp: 130, en: 100, def: 10, patk: 25, matk: 0,  colorClass: 'bg-berserker' },
            '弓手':    { hp: 100, en: 100, def: 12, patk: 20, matk: 10, colorClass: 'bg-archer' },
            '魔王(老師)': { hp: 99999, en: 9999, def: 40, patk: 40, matk: 40, colorClass: 'bg-boss' }
        };

        const SKILL_DATABASE = {
            '通用': [
                { name: '普通攻擊', apCost: 1, enCost: 0, type: 'atk_p', value: 1 },
                { name: '儲存 EN',  apCost: 1, enCost: 0, type: 'charge', value: 30 }
            ],
            '戰士': [
                { name: '英勇嘲諷', apCost: 2, enCost: 0, type: 'log_only', value: 0 },
                { name: '盾牌猛擊', apCost: 2, enCost: 0, type: 'atk_p', value: 10 },
                { name: '戰意高昂（回復）', apCost: 2, enCost: 0, type: 'heal', value: 30 },
                { name: '守護誓言', apCost: 2, enCost: 0, type: 'log_only', value: 0 },
                { name: '破甲擊',   apCost: 3, enCost: 0, type: 'atk_p', value: 20 },
                { name: '不落要塞', apCost: 3, enCost: 80, type: 'heal', value: 80 }
            ],
            '法師': [
                { name: '奧術飛彈', apCost: 2, enCost: 0, type: 'atk_m', value: 30 },
                { name: '冰凍術',   apCost: 2, enCost: 0, type: 'log_only', value: 0 },
                { name: '時光回溯（回復）', apCost: 2, enCost: 0, type: 'heal', value: 25 },
                { name: '魔力抽取', apCost: 2, enCost: 0, type: 'log_only', value: 20 },
                { name: '傳送術',   apCost: 2, enCost: 0, type: 'log_only', value: 0 },
                { name: '末日審判', apCost: 3, enCost: 100, type: 'atk_m', value: 60 }
            ],
            '狂戰士': [
                { name: '嗜血狂暴', apCost: 2, enCost: 0, type: 'atk_p', value: 35 },
                { name: '橫掃千軍', apCost: 2, enCost: 0, type: 'atk_p', value: 20 },
                { name: '不死意志（回復）', apCost: 2, enCost: 0, type: 'heal', value: 20 },
                { name: '恐嚇咆哮', apCost: 2, enCost: 0, type: 'log_only', value: 0 },
                { name: '碎骨擊',   apCost: 3, enCost: 0, type: 'atk_p', value: 35 },
                { name: '諸神黃昏', apCost: 3, enCost: 90, type: 'ult_berserk', value: 80 }
            ],
            '弓手': [
                { name: '二連矢',   apCost: 2, enCost: 0, type: 'atk_p', value: 30 },
                { name: '毒箭',     apCost: 2, enCost: 0, type: 'atk_p', value: 15 },
                { name: '自然治癒（回復）', apCost: 2, enCost: 0, type: 'heal', value: 25 },
                { name: '鷹眼專注', apCost: 2, enCost: 0, type: 'log_only', value: 0 },
                { name: '絆馬索',   apCost: 2, enCost: 0, type: 'debuff_ap', value: 1 },
                { name: '流星箭雨', apCost: 3, enCost: 80, type: 'atk_p', value: 40 }
            ],
            '魔王(老師)': [
                { name: '點名突擊', apCost: 1, enCost: 0, type: 'atk_p', value: 40 },
                { name: '隨堂小測驗', apCost: 2, enCost: 0, type: 'atk_m', value: 20 },
                { name: '沒收 iPad',  apCost: 3, enCost: 0, type: 'debuff_ap', value: 3 },
                { name: '讚美之光（回復）', apCost: 2, enCost: 0, type: 'boss_heal', value: 100 },
                { name: '期末考降臨', apCost: 5, enCost: 150, type: 'atk_m', value: 80 }
            ]
        };

        // === 📱 本機運作變數 ===
        let currentRoom = null;
        let myId = null;
        let allPlayersData = {};

        function togglePasswordInput() {
            const job = document.getElementById('player-job').value;
            document.getElementById('pwd-group').style.display = (job === '魔王(老師)') ? 'block' : 'none';
        }

        // === 🚀 核心：多裝置同步配對連線 ===
        function connectToRoom() {
            const roomNum = document.getElementById('room-id').value.trim();
            const name = document.getElementById('player-name').value.trim();
            const job = document.getElementById('player-job').value;
            const pwd = document.getElementById('boss-password').value;

            if (!roomNum || !name) { return alert('請完整填寫房間號碼與名字！'); }

            // 驗證魔王密碼
            if (job === '魔王(老師)' && pwd !== '123654789') {
                return alert('❌ 魔王認證密碼錯誤！無法竊取老師權限！');
            }

            currentRoom = roomNum;
            myId = (job === '魔王(老師)') ? 'teacher_boss' : 'student_' + Math.floor(Math.random() * 10000);

            const config = CLASS_CONFIGS[job];
            const initialData = {
                id: myId,
                name: name,
                job: job,
                hp: config.hp, 
                en: (job === '魔王(老師)') ? 9999 : 0, 
                ap: (job === '魔王(老師)') ? 9999 : 3  
            };

            if (job === '魔王(老師)') {
                database.ref(`rooms/${currentRoom}/players/teacher_boss`).once('value', (snapshot) => {
                    if (snapshot.exists() && snapshot.val().hp > 0) {
                        alert('❌ 房間內已有一個正在戰鬥的魔王老師了！');
                        location.reload();
                    } else {
                        startFirebaseSync(initialData);
                    }
                });
            } else {
                // 🛑 核心優化：沒有魔王玩家時，學生絕對不可以登入房間
                database.ref(`rooms/${currentRoom}/players/teacher_boss`).once('value', (snapshot) => {
                    if (!snapshot.exists() || snapshot.val().hp <= 0) {
                        alert('❌ 該房間目前沒有魔王(老師)在線！無法登入，請等待老師開啟房間。');
                    } else {
                        startFirebaseSync(initialData);
                    }
                });
            }
        }

        function startFirebaseSync(initialData) {
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('room-display').innerText = `房間：${currentRoom}`;
            if(initialData.job === '魔王(老師)') document.getElementById('boss-panel').style.display = 'block';

            const myRef = database.ref(`rooms/${currentRoom}/players/${myId}`);
            myRef.set(initialData);
            myRef.onDisconnect().remove();

            database.ref(`rooms/${currentRoom}/players`).on('value', (snapshot) => {
                allPlayersData = snapshot.val() || {};
                
                // 🛑 如果在戰鬥中，魔王玩家突然消失/中斷，強制將所有登入的角色登出
                if (myId !== 'teacher_boss' && !allPlayersData.hasOwnProperty('teacher_boss')) {
                    database.ref(`rooms/${currentRoom}/players`).off();
                    database.ref(`rooms/${currentRoom}/logs`).off();
                    alert('⚠️ 魔王老師已離開或房間關閉，所有人已被安全登出。');
                    location.reload();
                    return;
                }

                renderAllPlayers();
                updateControlPanel();
                populateTargets();
            });

            // 監聽戰鬥日誌 
            database.ref(`rooms/${currentRoom}/logs`).limitToLast(12).on('value', (snapshot) => {
                const logs = snapshot.val() || {};
                const logBox = document.getElementById('log-box');
                logBox.innerHTML = '';
                Object.values(logs).forEach(l => {
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    
                    if (l.includes('[🔴警告]') || l.includes('離開了遊戲頁面') || l.includes('點數不足')) {
                        entry.className += ' log-alert-red';
                    }
                    
                    entry.innerText = l;
                    logBox.appendChild(entry);
                });
                logBox.scrollTop = logBox.scrollHeight;
            });

            sendGlobalLog(`🚀【${initialData.name}】(${initialData.job}) 已成功連線進入戰場！`);
            
            // 監聽當前角色是否切換/離開頁面
            initPageVisibilityDetection(initialData.name);
        }

        // === 📢 角色離開頁面偵測機制 ===
        function initPageVisibilityDetection(playerName) {
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    sendGlobalLog(`[🔴警告] 角色【${playerName}】離開了遊戲頁面 (切換分頁/縮小瀏覽器)！`);
                }
            });
            window.addEventListener('beforeunload', () => {
                sendGlobalLog(`[🔴警告] 角色【${playerName}】關閉或重新整理了網頁！`);
            });
        }

        // === 👥 渲染畫面上「所有人」的卡片 ===
        function renderAllPlayers() {
            const container = document.getElementById('players-container');
            container.innerHTML = '';

            Object.values(allPlayersData).forEach(player => {
                const config = CLASS_CONFIGS[player.job];
                const isDead = player.hp <= 0;
                const hpPercent = Math.max(0, (player.hp / config.hp) * 100);
                const enPercent = Math.max(0, (player.en / config.en) * 100);
                const isBoss = player.job === '魔王(老師)';

                const card = document.createElement('div');
                card.className = `card ${player.id === myId ? 'is-me' : ''}`;
                if (isDead) card.style.opacity = '0.4';

                card.innerHTML = `
                    <div class="card-header">
                        <strong style="font-size:15px;">${player.name} ${isDead ? '💀' : ''}</strong>
                        <span class="role-tag ${config.colorClass}">${player.job}</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-label"><span>HP (${player.hp}/${config.hp})</span></div>
                        <div class="bar"><div class="fill fill-hp" style="width: ${hpPercent}%"></div></div>
                    </div>
                    <div class="bar-container">
                        <div class="bar-label"><span>EN (${isBoss ? '∞' : player.en + '/' + config.en})</span></div>
                        <div class="bar"><div class="fill fill-en" style="width: ${isBoss ? 100 : enPercent}%"></div></div>
                    </div>
                    <div style="margin-top:8px; display:flex; justify-content:space-between; align-items:center; font-size:11px;">
                        <span style="color:#aaa;">防:${config.def} 攻:${config.patk}</span>
                        <span class="ap-badge">AP: ${isBoss ? '∞' : player.ap}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // === 🎮 更新技能面板 (核心調整：AP 0 時變暗) ===
        function updateControlPanel() {
            const me = allPlayersData[myId];
            if (!me) return;

            document.getElementById('my-status-display').innerText = `${me.name} (${me.job})`;
            const skillsContainer = document.getElementById('skills-container');
            skillsContainer.innerHTML = '';

            const isBoss = me.job === '魔王(老師)';
            const totalSkills = [...SKILL_DATABASE['通用'], ...SKILL_DATABASE[me.job]];
            
            totalSkills.forEach(skill => {
                const btn = document.createElement('button');
                btn.className = `btn ${skill.enCost > 0 ? 'btn-ult' : ''}`;
                
                if (isBoss) {
                    if (me.hp <= 0) btn.disabled = true;
                    btn.innerHTML = `<span>${skill.name}</span><span style="font-size:9px;color:#f1c40f;">AP: 0 (∞)</span>`;
                } else {
                    const hasEnoughAP = me.ap >= skill.apCost;
                    const hasEnoughEN = me.en >= skill.enCost;
                    
                    if (me.ap <= 0 || !hasEnoughAP || !hasEnoughEN || me.hp <= 0) {
                        btn.disabled = true;
                    }
                    btn.innerHTML = `<span>${skill.name}</span><span style="font-size:9px;color:#aaa;">AP:${skill.apCost}</span>`;
                }

                btn.onclick = () => {
                    const currentMe = allPlayersData[myId];
                    if (!currentMe || currentMe.hp <= 0) return;
                    
                    if (!isBoss && currentMe.ap <= 0) {
                        sendGlobalLog(`[🔴警告] 學生【${currentMe.name}】目前 AP 點數不足 (AP:0)，強行按下 [${skill.name}] 被系統拒絕！`);
                        return;
                    }
                    executeBattleAction(currentMe, skill);
                };
                skillsContainer.appendChild(btn);
            });
        }

        function populateTargets() {
            const dropdown = document.getElementById('target-dropdown');
            const currentSel = dropdown.value;
            dropdown.innerHTML = '';

            Object.values(allPlayersData).forEach(p => {
                if (p.hp > 0) {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.innerText = `${p.id === myId ? '【自己】' : ''}${p.name} (${p.job}) - HP:${p.hp}`;
                    dropdown.appendChild(opt);
                }
            });
            if (currentSel) dropdown.value = currentSel;
        }

        // === ⚔️ 跨終端戰鬥結算 ===
        function executeBattleAction(me, skill) {
            const targetId = document.getElementById('target-dropdown').value;
            const target = allPlayersData[targetId];

            if (!target && skill.type !== 'charge') return alert('請選擇一個目標！');

            const isBoss = me.job === '魔王(老師)';

            // 🚫 絕對不允許角色攻擊自己
            const attackTypes = ['atk_p', 'atk_m', 'ult_berserk', 'debuff_ap'];
            if (target && target.id === me.id && attackTypes.includes(skill.type)) {
                alert('🚫 錯誤：不可以選擇自己作為攻擊或扣除 AP 的目標！');
                return;
            }

            // 扣除點數 (魔王無限)
            if (!isBoss) {
                if (me.ap < skill.apCost) {
                    sendGlobalLog(`[🔴警告] 學生【${me.name}】點數不足，無法施放 [${skill.name}]！`);
                    return;
                }
                me.ap -= skill.apCost;
                me.en -= skill.enCost;
            }

            let logText = '';
            const myConfig = CLASS_CONFIGS[me.job];
            const targetConfig = target ? CLASS_CONFIGS[target.job] : null;

            if (skill.type === 'charge') {
                if (!isBoss) me.en = Math.min(myConfig.en, me.en + skill.value);
                logText = `⚡【${me.name}】使用了 [${skill.name}]，將 EN 提升了 ${skill.value} 點。`;
            } else {
                if (skill.type === 'atk_p') {
                    let dmg = Math.max(1, (myConfig.patk + skill.value) - targetConfig.def);
                    target.hp = Math.max(0, target.hp - dmg);
                    if (target.job !== '魔王(老師)') target.en = Math.min(targetConfig.en, target.en + 10);
                    logText = `⚔️【${me.name}】對【${target.name}】施展 [${skill.name}]，重創其 ${dmg} 點物理血量！`;
                } else if (skill.type === 'atk_m') {
                    let dmg = Math.max(1, (myConfig.matk + skill.value) - Math.floor(targetConfig.def * 0.5));
                    target.hp = Math.max(0, target.hp - dmg);
                    if (target.job !== '魔王(老師)') target.en = Math.min(targetConfig.en, target.en + 15);
                    logText = `🔮【${me.name}】對【${target.name}】降下 [${skill.name}]，轟出 ${dmg} 點法術傷害！`;
                } else if (skill.type === 'heal') {
                    target.hp = Math.min(targetConfig.hp, target.hp + skill.value);
                    logText = `💚【${me.name}】對【${target.name}】使用了 [${skill.name}]，使其回復 ${skill.value} 點 HP！`;
                } else if (skill.type === 'debuff_ap') {
                    if (target.job !== '魔王(老師)') target.ap = Math.max(0, target.ap - skill.value);
                    logText = `🚫【${me.name}】對【${target.name}】使出 [${skill.name}]，無情扣除其 ${skill.value} 點 AP！`;
                } else if (skill.type === 'boss_heal') {
                    me.hp = Math.min(myConfig.hp, me.hp + skill.value);
                    target.ap += 2;
                    logText = `👑 魔王老師使出 [${skill.name}]！老師大補血 ${skill.value}，並賞賜目標同學 2 AP！`;
                } else if (skill.type === 'ult_berserk') {
                    let dmg = Math.max(1, (myConfig.patk + skill.value) - targetConfig.def);
                    target.hp = Math.max(0, target.hp - dmg);
                    me.hp = Math.min(myConfig.hp, me.hp + Math.floor(dmg * 0.5));
                    logText = `🔥【${me.name}】開啟 [諸神黃昏] 劈向【${target.name}】造成 ${dmg} 傷害並瘋狂吸血！`;
                } else if (skill.type === 'log_only') {
                    logText = `✨【${me.name}】對【${target.name}】施展了狀態技 [${skill.name}]！`;
                }

                if (target.hp <= 0) logText += ` 💀【${target.name}】已陣亡倒地！`;
            }

            database.ref(`rooms/${currentRoom}/players/${me.id}`).set(me);
            if (target && target.id !== me.id) {
                database.ref(`rooms/${currentRoom}/players/${target.id}`).set(target);
            }
            sendGlobalLog(logText);
        }

        function sendGlobalLog(text) {
            database.ref(`rooms/${currentRoom}/logs`).push(`[${new Date().toLocaleTimeString()}] ${text}`);
        }

        // === 👑 魔王老師專屬控制函數 ===
        function bossDistributeAP() {
            Object.values(allPlayersData).forEach(p => {
                if (p.hp > 0 && p.job !== '魔王(老師)') {
                    database.ref(`rooms/${currentRoom}/players/${p.id}/ap`).set(p.ap + 2);
                }
            });
            sendGlobalLog(`📢 老師按下了管理面板：「發放全體認真聽講的同學 +2 AP！魔王不需要為自己補充點數，因為魔王點數無限！」`);
        }

        function bossResetRoom() {
            if(confirm("確定要重置整個房間，將所有學生血量與點數洗牌回滿嗎？")) {
                Object.values(allPlayersData).forEach(p => {
                    const config = CLASS_CONFIGS[p.job];
                    p.hp = config.hp;
                    p.en = (p.job === '魔王(老師)') ? 9999 : 0;
                    p.ap = (p.job === '魔王(老師)') ? 9999 : 3;
                    database.ref(`rooms/${currentRoom}/players/${p.id}`).set(p);
                });
                database.ref(`rooms/${currentRoom}/logs`).remove();
                sendGlobalLog(`🔄 魔王老師重置了整個戰場，新一輪的課堂對抗開始！`);
            }
        }
    </script>
